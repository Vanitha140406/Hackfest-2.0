{% extends "base.html" %}

{% block title %}Student Registration - Campus Bites{% endblock %}

{% block content %}
<div class="form-card">
    <div style="text-align: center; margin-bottom: 20px;">
        <div style="font-size: 40px; margin-bottom: 8px;">🎓</div>
        <h2 style="font-size: 24px; font-weight: 800;">Student Sign Up</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Register once to order and skip long canteen lines</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" class="form-control" placeholder="e.g. Rahul Sharma" required autofocus>
        </div>

        <div class="form-group">
            <label for="username">College Roll No / Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="e.g. 21CS042 or rahul" required>
        </div>

        <div class="form-group">
            <label for="phone">Mobile Number (Optional)</label>
            <input type="tel" id="phone" name="phone" class="form-control" placeholder="10-digit mobile number">
        </div>

        <div class="form-group">
            <label for="password">Create Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 4 characters" required minlength="4">
        </div>

        <button type="submit" class="btn" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 16px;">Register Student Account</button>
    </form>

    <div style="margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 14px;">
        <p>Already registered? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 700; text-decoration: none;">Login here</a></p>
    </div>
</div>
{% endblock %}
