{% extends "base.html" %}

{% block title %}Add New Food Item - Admin - Campus Bites{% endblock %}

{% block content %}
<div class="form-card" style="max-width: 550px;">
    <div style="margin-bottom: 20px;">
        <a href="{{ url_for('manage_food') }}" style="color: var(--text-muted); text-decoration: none; font-size: 13px;">← Back to Food Catalog</a>
        <h2 style="font-size: 22px; font-weight: 800; margin-top: 8px;">Add New Food Item</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Add a fresh dish to the canteen menu</p>
    </div>

    <form method="POST" action="{{ url_for('add_food') }}">
        <div class="form-group">
            <label for="name">Food Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Masala Dosa" required autofocus>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category" class="form-control" required>
                <option value="Meals">🍛 Meals</option>
                <option value="Snacks" selected>🥪 Snacks</option>
                <option value="Fast Food">🍔 Fast Food</option>
                <option value="Desserts">🍰 Desserts</option>
                <option value="Beverages">🥤 Beverages</option>
            </select>
        </div>

        <div class="form-group">
            <label for="price">Price in INR (₹)</label>
            <input type="number" step="1" min="1" id="price" name="price" class="form-control" placeholder="e.g. 40" required>
        </div>

        <div class="form-group">
            <label for="description">Short Description</label>
            <textarea id="description" name="description" class="form-control" rows="2" placeholder="Briefly describe taste, ingredients, or type"></textarea>
        </div>

        <div class="form-group">
            <label for="image">Image Filename / URL</label>
            <input type="text" id="image" name="image" class="form-control" value="samosa.jpg" placeholder="e.g. samosa.jpg, burger.jpg, or custom filename" required>
            <small style="color: var(--text-muted); display: block; margin-top: 4px;">Placed inside static/images/ (e.g. samosa.jpg, veg_meals.jpg, coldcoffee.jpg)</small>
        </div>

        <div class="form-group">
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <input type="checkbox" name="available" checked>
                <span>Available immediately in stock</span>
            </label>
        </div>

        <button type="submit" class="btn" style="width: 100%; padding: 12px; font-size: 15px; margin-top: 10px;">Save Food Item to Menu</button>
    </form>
</div>
{% endblock %}
